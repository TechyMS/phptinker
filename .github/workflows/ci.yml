name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: tokenizer
          coverage: none
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Prepare Electron sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Electron may download its binary lazily on first require.
          node -e "require('electron')"
          sandbox_path="$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          test -f "$sandbox_path"
          test ! -L "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%u:%g:%a' "$sandbox_path")" = '0:0:4755'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npm run test:desktop
        if: runner.os != 'Linux'
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
